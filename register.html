<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            /* box-sizing: border-box;
            font-family: Arial, sans-serif; */
        }

        body {
            background-image: url('./laptop.webp');
            background-repeat: no-repeat;
            background-size: cover;
        }

        .container {
            background-color: rgba(252, 251, 249, 0.2);
            width: 18%;
            height: 300px;
            margin: auto;
            border-radius: 5px;
            padding: 10px 0 10px 10px;
            box-shadow: 3px 3px 3px rosybrown;
            backdrop-filter: blur(10px);
            margin-top: 10%;
            border: 1px solid grey;
        }

        .name {
            width: 40%;
            position: relative;
        }

        .name input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }
        select{
            width: 230%;
            padding: 5px;
            margin-left: 5px;
        }
        .name i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .mail {
            width: 40%;
            position: relative;
        }

        .mail input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }

        .mail i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .num {
            width: 40%;
            position: relative;
        }

        .num input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }

        .num i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .sel {
            width: 40%;
            position: relative;
        }

        .sel input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }

        .sel i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .lock {
            width: 40%;
            position: relative;
        }

        .lock input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }

        .lock i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .regi {
            width: 40%;
            position: relative;
        }

        .regi input {
            width: 180%;
            padding: 8px;
            padding-left: 40px;
            border: 0;
            box-shadow: 0 0 2px gray;
            border-radius: 3px;
            margin: 5px;
        }

        .regi i {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        .button button {
            width: 95%;
            padding: 8px;
            text-align: center;
            border-radius: 5px;
            border: 0;

        }
    </style>

</head>

<body>
    <div class="container">
        <h2><i class="fa fa-user-plus"></i>Register Now</h2>
        <div class="name">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Enter your full name">
        </div>
        <div class="mail">
            <i class="fa fa-envelope"></i>
            <input type="text" placeholder="Enter your email">
        </div>
        <div class="num">
            <i class="fa fa-phone"></i>
            <input type="text" placeholder="Enter your mobile number">
        </div>
        <div class="sel">
            <select>
                <option>Select Course</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>Java</option>
            </select>
        </div>
        <div class="lock">
            <i class="fa fa-lock"></i>
            <input type="text" placeholder="Create Password">
        </div>
        <div class="button">
            <button><i class="fa fa-paper-plane"></i>Register</button>
        </div>
        <div>
            <i class="ac">Already have an account?Login</i>
        </div>
    </div>

</body>

</html>
